<svg viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#fafafa"/>

  <text x="640" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Microservices Architecture — Target Domains</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#666">Customers · Requests · Notifications · Documents · Reporting</text>

  <!-- API Gateway -->
  <rect x="500" y="80" width="280" height="50" rx="8" fill="#37474f"/>
  <text x="640" y="110" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">API Gateway / BFF</text>

  <!-- arrows gateway to services -->
  <path d="M560,130 L200,190" stroke="#455a64" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M610,130 L420,190" stroke="#455a64" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M670,130 L670,190" stroke="#455a64" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M720,130 L900,190" stroke="#455a64" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M760,130 L1120,190" stroke="#455a64" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Service boxes row -->
  <!-- Customers -->
  <g>
    <rect x="70" y="190" width="200" height="70" rx="8" fill="#1565c0"/>
    <text x="170" y="220" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Customers Service</text>
    <text x="170" y="240" text-anchor="middle" font-size="11" fill="#e3f2fd">owns customer data</text>
    <rect x="140" y="280" width="60" height="34" rx="4" fill="#0d47a1"/>
    <text x="170" y="301" text-anchor="middle" font-size="10" fill="#fff">DB</text>
    <path d="M170,260 L170,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Requests -->
  <g>
    <rect x="330" y="190" width="200" height="70" rx="8" fill="#2e7d32"/>
    <text x="430" y="216" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Requests Service</text>
    <text x="430" y="234" text-anchor="middle" font-size="11" fill="#e8f5e9">create / change status</text>
    <text x="430" y="250" text-anchor="middle" font-size="10" fill="#c8e6c9">(core domain)</text>
    <rect x="330" y="280" width="90" height="34" rx="4" fill="#1b5e20"/>
    <text x="375" y="301" text-anchor="middle" font-size="10" fill="#fff">DB</text>
    <rect x="430" y="280" width="100" height="34" rx="4" fill="#f9a825"/>
    <text x="480" y="301" text-anchor="middle" font-size="9.5" fill="#3e2723" font-weight="600">Outbox table</text>
    <path d="M375,260 L375,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M430,260 L480,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Documents -->
  <g>
    <rect x="590" y="190" width="200" height="70" rx="8" fill="#6a1b9a"/>
    <text x="690" y="220" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Documents Service</text>
    <text x="690" y="240" text-anchor="middle" font-size="11" fill="#f3e5f5">files / attachments</text>
    <rect x="620" y="280" width="60" height="34" rx="4" fill="#4a148c"/>
    <text x="650" y="301" text-anchor="middle" font-size="10" fill="#fff">DB</text>
    <rect x="700" y="280" width="80" height="34" rx="4" fill="#4a148c"/>
    <text x="740" y="301" text-anchor="middle" font-size="9.5" fill="#fff">Blob store</text>
    <path d="M650,260 L650,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M700,260 L740,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Notifications -->
  <g>
    <rect x="850" y="190" width="200" height="70" rx="8" fill="#c62828"/>
    <text x="950" y="216" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Notifications Service</text>
    <text x="950" y="234" text-anchor="middle" font-size="11" fill="#ffcdd2">email / SMS / push</text>
    <text x="950" y="250" text-anchor="middle" font-size="10" fill="#ffcdd2">(may be down)</text>
    <rect x="880" y="280" width="60" height="34" rx="4" fill="#8e0000"/>
    <text x="910" y="301" text-anchor="middle" font-size="10" fill="#fff">DB</text>
    <rect x="960" y="280" width="80" height="34" rx="4" fill="#8e0000"/>
    <text x="1000" y="301" text-anchor="middle" font-size="9.5" fill="#fff">Provider API</text>
    <path d="M910,260 L910,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M960,260 L1000,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Reporting -->
  <g>
    <rect x="1080" y="190" width="180" height="70" rx="8" fill="#546e7a"/>
    <text x="1170" y="220" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Reporting Service</text>
    <text x="1170" y="240" text-anchor="middle" font-size="11" fill="#eceff1">read models / BI</text>
    <rect x="1130" y="280" width="80" height="34" rx="4" fill="#37474f"/>
    <text x="1170" y="301" text-anchor="middle" font-size="9.5" fill="#fff">Read-only DB</text>
    <path d="M1170,260 L1170,280" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Message broker -->
  <rect x="330" y="380" width="620" height="60" rx="10" fill="#263238"/>
  <text x="640" y="405" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">Event Bus / Message Broker  (e.g. RabbitMQ, Azure Service Bus, Kafka)</text>
  <text x="640" y="424" text-anchor="middle" font-size="11" fill="#b0bec5">topics: RequestCreated · RequestStatusChanged · DocumentUploaded ...</text>

  <!-- Outbox -> Broker -->
  <path d="M480,314 L480,380" stroke="#f9a825" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="495" y="355" font-size="10.5" fill="#8d6e00">relay publishes</text>
  <text x="495" y="368" font-size="10.5" fill="#8d6e00">(polling / CDC)</text>

  <!-- Documents -> Broker (optional publish) -->
  <path d="M690,260 L640,380" stroke="#9c27b0" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <!-- Broker -> Notifications (consume) -->
  <path d="M900,380 L950,260" stroke="#c62828" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="945" y="330" font-size="10.5" fill="#8e0000">consume + retry</text>

  <!-- Broker -> Reporting (consume) -->
  <path d="M950,380 L1170,260" stroke="#546e7a" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <!-- Broker -> Customers (consume, e.g. cross-domain lookups) -->
  <path d="M400,380 L250,260" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <!-- DLQ -->
  <rect x="1000" y="460" width="180" height="60" rx="8" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="1090" y="485" text-anchor="middle" font-size="12.5" fill="#c62828" font-weight="700">Dead-Letter Queue</text>
  <text x="1090" y="503" text-anchor="middle" font-size="10" fill="#c62828">failed after N retries</text>
  <path d="M950,440 L1030,460" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrowRed)" stroke-dasharray="3 3"/>

  <!-- alert box from DLQ -->
  <rect x="1000" y="550" width="180" height="50" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="1090" y="572" text-anchor="middle" font-size="11" fill="#8d6e00" font-weight="600">Alert on-call /</text>
  <text x="1090" y="588" text-anchor="middle" font-size="11" fill="#8d6e00" font-weight="600">manual replay</text>
  <path d="M1090,520 L1090,550" stroke="#f9a825" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Reliability notes box -->
  <rect x="70" y="460" width="880" height="330" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="90" y="490" font-size="15" font-weight="700" fill="#1a1a1a">Reliable communication: Request → Notification</text>

  <text x="90" y="520" font-size="12.5" fill="#333" font-weight="600">1. Transactional Outbox (Requests Service)</text>
  <text x="105" y="540" font-size="11.5" fill="#444">Status change and "RequestStatusChanged" event are written in the SAME DB transaction</text>
  <text x="105" y="557" font-size="11.5" fill="#444">(outbox table). A relay process (or CDC / Debezium) publishes it to the broker.</text>
  <text x="105" y="574" font-size="11.5" fill="#444">→ guarantees the event is never lost even if the broker is down at write time.</text>

  <text x="90" y="602" font-size="12.5" fill="#333" font-weight="600">2. Async messaging, not a direct call</text>
  <text x="105" y="622" font-size="11.5" fill="#444">Requests Service never calls Notifications Service synchronously (no HTTP dependency).</text>
  <text x="105" y="639" font-size="11.5" fill="#444">It publishes an event and returns immediately — Requests stays available even if</text>
  <text x="105" y="656" font-size="11.5" fill="#444">Notifications is completely down.</text>

  <text x="90" y="684" font-size="12.5" fill="#333" font-weight="600">3. Durable queue + consumer-side retry</text>
  <text x="105" y="704" font-size="11.5" fill="#444">The broker persists the message. Notifications Service consumes at-least-once, with</text>
  <text x="105" y="721" font-size="11.5" fill="#444">exponential backoff retries when the downstream provider (email/SMS) fails.</text>

  <text x="90" y="749" font-size="12.5" fill="#333" font-weight="600">4. Idempotent consumer</text>
  <text x="105" y="769" font-size="11.5" fill="#444">Each event carries a unique id; Notifications Service records processed ids so a</text>
  <text x="105" y="786" font-size="11.5" fill="#444">redelivered message is not sent twice.</text>

  <text x="90" y="814" font-size="12.5" fill="#333" font-weight="600">5. Dead-letter queue + alerting</text>
  <text x="105" y="834" font-size="11.5" fill="#444">After N failed retries, the message moves to a DLQ instead of being dropped — an</text>
  <text x="105" y="851" font-size="11.5" fill="#444">on-call alert fires and the message can be inspected/replayed once the issue is fixed.</text>

  <text x="90" y="879" font-size="11.5" fill="#666" font-style="italic">Net effect: Notifications going down delays notifications, but never blocks Requests and never loses an event.</text>
</svg>
