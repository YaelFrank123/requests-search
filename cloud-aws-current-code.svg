<svg viewBox="0 0 1360 1150" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="1150" fill="#ffffff"/>
  <text x="680" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">AWS Deployment — Current Code (Requests.Api monolith)</text>
  <text x="680" y="52" text-anchor="middle" font-size="12" fill="#666">Matches what is actually implemented today: one .NET 8 API (auth + requests CRUD/search/filter) over a relational store — no split services, no async workflows yet</text>

  <!-- Users -->
  <ellipse cx="300" cy="100" rx="52" ry="26" fill="#e3f2fd" stroke="#555"/>
  <text x="300" y="97" text-anchor="middle" font-size="11" font-weight="600">Users</text>
  <text x="300" y="111" text-anchor="middle" font-size="9.5" fill="#333">(browser)</text>

  <path d="M300,126 L300,158" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- Route53 -->
  <rect x="220" y="160" width="160" height="44" rx="6" fill="#e3f2fd" stroke="#555"/>
  <text x="300" y="178" text-anchor="middle" font-size="11" font-weight="600">Route 53</text>
  <text x="300" y="194" text-anchor="middle" font-size="9.5" fill="#333">(DNS) + ACM (TLS cert)</text>

  <path d="M255,204 Q180,240 150,266" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <path d="M345,204 Q430,240 460,266" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <text x="150" y="235" font-size="9" fill="#444">static assets</text>
  <text x="420" y="235" font-size="9" fill="#444">/api/* (XHR + Bearer JWT)</text>

  <!-- CloudFront + S3 -->
  <rect x="60" y="268" width="180" height="56" rx="6" fill="#e3f2fd" stroke="#555"/>
  <text x="150" y="290" text-anchor="middle" font-size="11" font-weight="600">CloudFront + S3</text>
  <text x="150" y="306" text-anchor="middle" font-size="9.5" fill="#333">static Angular build</text>
  <text x="150" y="318" text-anchor="middle" font-size="8.5" fill="#666">(FE deployed independently of the API)</text>

  <!-- ALB -->
  <rect x="370" y="268" width="180" height="56" rx="6" fill="#fff3e0" stroke="#555"/>
  <text x="460" y="290" text-anchor="middle" font-size="11" font-weight="600">Application Load Balancer</text>
  <text x="460" y="306" text-anchor="middle" font-size="9.5" fill="#333">internet-facing, TLS via ACM</text>
  <text x="460" y="318" text-anchor="middle" font-size="8.5" fill="#666">no API Gateway needed — the app validates its own JWTs</text>

  <path d="M460,324 L460,356" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- VPC cluster -->
  <rect x="60" y="358" width="820" height="420" rx="10" fill="none" stroke="#546e7a" stroke-dasharray="5,2"/>
  <text x="120" y="376" font-size="11" fill="#546e7a" font-weight="700">VPC (2 Availability Zones)</text>

  <!-- Public subnet -->
  <rect x="80" y="386" width="250" height="70" rx="8" fill="none" stroke="#ff8f00" stroke-dasharray="4,2"/>
  <text x="205" y="400" text-anchor="middle" font-size="9.5" fill="#ff8f00" font-weight="700">Public subnets</text>
  <rect x="100" y="406" width="210" height="40" rx="6" fill="#fff3e0" stroke="#555"/>
  <text x="205" y="422" text-anchor="middle" font-size="10" font-weight="600">NAT Gateway</text>
  <text x="205" y="436" text-anchor="middle" font-size="8.5" fill="#333">outbound only (image pulls, etc.)</text>

  <!-- Private subnet / ECS -->
  <rect x="80" y="470" width="760" height="180" rx="8" fill="none" stroke="#26a69a" stroke-dasharray="4,2"/>
  <text x="460" y="486" text-anchor="middle" font-size="11" fill="#26a69a" font-weight="700">Private subnets — ECS on Fargate</text>

  <rect x="360" y="500" width="200" height="120" rx="8" fill="#e0f2f1" stroke="#555"/>
  <text x="460" y="522" text-anchor="middle" font-size="11" font-weight="600">Requests.Api container</text>
  <text x="460" y="538" text-anchor="middle" font-size="9" fill="#333">.NET 8 — one service</text>
  <text x="460" y="552" text-anchor="middle" font-size="9" fill="#333">AuthController + RequestsController</text>
  <text x="460" y="566" text-anchor="middle" font-size="9" fill="#333">JWT issued &amp; validated in-process</text>
  <text x="460" y="580" text-anchor="middle" font-size="9" fill="#333">global exception handler → ProblemDetails</text>
  <text x="460" y="598" text-anchor="middle" font-size="9" font-weight="600" fill="#26a69a">scale: CPU 60% / RequestCountPerTarget</text>
  <text x="460" y="612" text-anchor="middle" font-size="9" font-weight="600" fill="#26a69a">min 2 · max 6 tasks (spread over both AZs)</text>

  <path d="M460,356 L460,500" stroke="#444" stroke-width="0" fill="none"/>
  <path d="M460,324 L460,356 M460,356 L460,500" stroke="none"/>

  <!-- redraw ALB->ECS through VPC boundary cleanly -->
  <path d="M460,356 L460,500" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- RDS -->
  <path d="M760,660 C760,663 733,665 700,665 667,665 640,663 640,660 640,660 640,608 640,608 640,605 667,603 700,603 733,603 760,605 760,608 760,608 760,660 760,660" fill="#ede7f6" stroke="#555"/>
  <path d="M760,660 C760,657 733,655 700,655 667,655 640,657 640,660" fill="none" stroke="#555"/>
  <text x="700" y="628" text-anchor="middle" font-size="10" font-weight="600">RDS (PostgreSQL)</text>
  <text x="700" y="642" text-anchor="middle" font-size="9" fill="#333">requests-db, Multi-AZ</text>

  <path d="M460,620 Q560,650 640,634" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>

  <text x="560" y="670" font-size="8.5" fill="#c62828" font-weight="600">⚠ replaces the local SQLite file — Fargate tasks are stateless</text>
  <text x="560" y="682" font-size="8.5" fill="#c62828" font-weight="600">and ephemeral, so a file-based DB can't be shared across tasks/AZs</text>
  <text x="560" y="694" font-size="8.5" fill="#c62828" font-weight="600">or survive a redeploy — same EF Core code, different provider/connection string</text>

  <!-- AWS managed services row -->
  <rect x="920" y="386" width="180" height="56" rx="6" fill="#efebe9" stroke="#555"/>
  <text x="1010" y="408" text-anchor="middle" font-size="10.5" font-weight="600">Secrets Manager</text>
  <text x="1010" y="423" text-anchor="middle" font-size="9" fill="#333">JWT signing key · DB credentials</text>
  <text x="1010" y="435" text-anchor="middle" font-size="8" fill="#666">read by the task at startup</text>

  <rect x="1120" y="386" width="180" height="56" rx="6" fill="#efebe9" stroke="#555"/>
  <text x="1210" y="408" text-anchor="middle" font-size="10.5" font-weight="600">ECR</text>
  <text x="1210" y="423" text-anchor="middle" font-size="9" fill="#333">container image</text>
  <text x="1210" y="435" text-anchor="middle" font-size="8" fill="#666">pulled by Fargate on deploy</text>

  <path d="M920,414 L560,530" stroke="#444" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#a1)"/>
  <path d="M1120,414 L560,560" stroke="#444" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#a1)"/>

  <!-- CloudWatch -->
  <rect x="920" y="470" width="380" height="90" rx="6" fill="#efebe9" stroke="#555"/>
  <text x="1110" y="492" text-anchor="middle" font-size="10.5" font-weight="600">CloudWatch</text>
  <text x="1110" y="508" text-anchor="middle" font-size="9" fill="#333">Logs (ECS awslogs driver, incl. ProblemDetails/error logs)</text>
  <text x="1110" y="522" text-anchor="middle" font-size="9" fill="#333">Metrics: CPU, memory, ALB 5xx rate, p95 latency, RDS CPU/connections</text>
  <text x="1110" y="536" text-anchor="middle" font-size="9" fill="#333">Alarms → SNS ops-alerts → on-call (5xx spike, unhealthy targets, RDS storage)</text>
  <text x="1110" y="552" text-anchor="middle" font-size="8" fill="#666">← ECS service, ALB, RDS</text>

  <path d="M840,540 L920,515" stroke="#444" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#a1)"/>

  <!-- Messaging: explicitly out of scope -->
  <rect x="900" y="580" width="400" height="120" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-dasharray="6,3"/>
  <text x="1100" y="602" text-anchor="middle" font-size="11.5" font-weight="700" fill="#757575">Messaging — not needed by current code</text>
  <text x="1100" y="622" text-anchor="middle" font-size="9.5" fill="#616161">The API is a single synchronous request/response service:</text>
  <text x="1100" y="636" text-anchor="middle" font-size="9.5" fill="#616161">no background workers, no cross-service events today.</text>
  <text x="1100" y="656" text-anchor="middle" font-size="9.5" fill="#616161">Extension point for later, once the domains in</text>
  <text x="1100" y="670" text-anchor="middle" font-size="9.5" fill="#616161">architecture-generic.svg are actually split out</text>
  <text x="1100" y="684" text-anchor="middle" font-size="9.5" fill="#616161">(SNS/SQS fan-out — see the separate extended-architecture diagram).</text>

  <!-- Notes / ADR box -->
  <rect x="60" y="810" width="1240" height="300" rx="10" fill="#fafafa" stroke="#ccc"/>
  <text x="80" y="838" font-size="13.5" font-weight="700" fill="#1a1a1a">Decisions specific to deploying THIS code (not the extended architecture)</text>

  <text x="80" y="866" font-size="11" fill="#333" font-weight="600">1. Compute: single ECS Fargate service, not one-per-domain</text>
  <text x="95" y="883" font-size="10.3" fill="#444">The code is one monolithic API (Auth + Requests controllers sharing one DbContext) — deploying it as several services would be</text>
  <text x="95" y="898" font-size="10.3" fill="#444">theater, not architecture. One task definition, 2-6 tasks across both AZs behind the ALB for HA and rolling deploys.</text>

  <text x="80" y="924" font-size="11" fill="#333" font-weight="600">2. DB: RDS PostgreSQL replaces the local SQLite file — the one real infrastructure change from the code as written</text>
  <text x="95" y="941" font-size="10.3" fill="#444">appsettings.json today points EF Core at a SQLite file on local disk. That works for a single dev process but not for &gt;1 Fargate task:</text>
  <text x="95" y="956" font-size="10.3" fill="#444">the file isn't shared, and a task restart loses it. This is a connection-string/provider swap, not a code redesign.</text>

  <text x="80" y="982" font-size="11" fill="#333" font-weight="600">3. No API Gateway in front of the ALB</text>
  <text x="95" y="999" font-size="10.3" fill="#444">JWT issuance and validation already live inside the app (AddJwtBearer in Program.cs). Adding API Gateway would duplicate that</text>
  <text x="95" y="1014" font-size="10.3" fill="#444">responsibility for no benefit at this scale — the ALB alone does TLS termination and path-based routing.</text>

  <text x="80" y="1040" font-size="11" fill="#333" font-weight="600">4. Messaging is deliberately absent, not forgotten</text>
  <text x="95" y="1057" font-size="10.3" fill="#444">Nothing in the current code publishes or consumes events. Showing SQS/SNS here would describe a system that doesn't exist yet.</text>
  <text x="95" y="1072" font-size="10.3" fill="#444">See the separate extended-architecture cloud diagram for how messaging fits once Documents/Notifications/Reporting are split out.</text>

  <text x="80" y="1098" font-size="10.5" fill="#666" font-style="italic">Scope: this diagram covers the code as written today. It intentionally does not assume architecture-generic.svg has been implemented.</text>
</svg>
